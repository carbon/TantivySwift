[package]
name = "tantivy_ffi"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "tantivy_ffi"
# staticlib: a self-contained .a we link straight into the Swift binary. The
# WebAssembly build overrides this with `cargo rustc --crate-type cdylib` (see
# scripts/build-wasm.sh), so the same C ABI is what JavaScript calls.
crate-type = ["staticlib"]

[features]
default = ["native"]
# On-disk indexes (memory-mapped) and zstd-compressed columns — the Apple
# build. Off for WebAssembly: there is no filesystem to map, and zstd is C that
# would need a WASI C toolchain to compile.
native = ["tantivy/mmap", "tantivy/columnar-zstd-compression"]
# Replace tantivy's `IndexWriter`, which spawns indexing, merging and
# compression threads, with a writer that does all of that on the calling
# thread (src/single_threaded.rs). Required on WebAssembly without threads;
# also buildable natively, so the Swift test suite can exercise it.
single-threaded = []

[dependencies]
# Pinned to the exact tantivy 0.26.1 release from crates.io. Default features
# are spelled out so `native` can gate the two that WebAssembly cannot use.
tantivy = { version = "=0.26.1", default-features = false, features = [
    "stopwords",
    "lz4-compression",
    "stemmer",
] }
# `BitSet`, for writing delete files in the single-threaded writer. tantivy
# takes one in `write_alive_bitset` but does not re-export the type. Pinned to
# tantivy's exact copy so the two are the same type.
tantivy-common = "=0.11.0"
serde_json = "1"
# Byte values in a *query* tree are base64 (queries are JSON; documents and hits
# are MessagePack and carry bytes natively). Already in the tree via tantivy.
base64 = "0.22"
# RFC3339 parsing for date terms/ranges in the structured query API, and
# formatting so the MessagePack envelope renders dates identically to the JSON
# one (which gets it from tantivy's own serde impl).
time = { version = "0.3", features = ["parsing", "formatting"] }
# The stemmer behind `en_stem_keep` (see keep_stem.rs). tantivy's own `Stemmer`
# filter replaces the token, so the keeping filter drives the algorithm itself.
# Pinned to tantivy's exact copy so `en_stem_keep` and `en_stem` stem alike.
rust-stemmers = "=1.2.0"
# Escapes `multi_phrase` alternatives into literal regex alternations. Pinned to
# the exact parser tantivy-fst compiles those patterns with, so what `escape`
# emits is what the automaton reads.
regex-syntax = "=0.8.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Cargo strips build scripts and proc-macros in release by default, and on
# macOS 27 dyld refuses to load the stripped proc-macro dylibs ("mis-aligned
# LINKEDIT string pool"), failing the build with "can't find crate". They only
# run at build time, so leaving them unstripped costs nothing in the output.
[profile.release.build-override]
strip = false
