[package]
name = "tantivy_ffi"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "tantivy_ffi"
# staticlib: a self-contained .a we link straight into the Swift binary.
crate-type = ["staticlib"]

[dependencies]
# Pinned to the exact tantivy 0.26.1 release from crates.io.
tantivy = "=0.26.1"
serde_json = "1"
# Byte values in a *query* tree are base64 (queries are JSON; documents and hits
# are MessagePack and carry bytes natively). Already in the tree via tantivy.
base64 = "0.22"
# RFC3339 parsing for date terms/ranges in the structured query API, and
# formatting so the MessagePack envelope renders dates identically to the JSON
# one (which gets it from tantivy's own serde impl).
time = { version = "0.3", features = ["parsing", "formatting"] }
# The stemmer behind `en_stem_keep` (see keep_stem.rs). tantivy's own `Stemmer`
# filter replaces the token, so the keeping filter drives the algorithm itself.
# Pinned to tantivy's exact copy so `en_stem_keep` and `en_stem` stem alike.
rust-stemmers = "=1.2.0"
# Escapes `multi_phrase` alternatives into literal regex alternations. Pinned to
# the exact parser tantivy-fst compiles those patterns with, so what `escape`
# emits is what the automaton reads.
regex-syntax = "=0.8.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
