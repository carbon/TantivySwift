name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. rapid PR pushes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test (host mode)
    # Package.swift requires Swift 6.4, which ships with Xcode 27. GitHub's
    # macos-26 image only carries Xcode 26.x; Xcode 27 lives on its own
    # (preview) image, selected with the `xcode-27` label. That image ships a
    # single Xcode, already the default at /Applications/Xcode.app, so no
    # setup-xcode step is needed. Once Xcode 27 lands on the regular macos-26
    # image this can move back to `macos-26` plus a setup-xcode step.
    # See https://github.com/actions/runner-images/issues/14404
    runs-on: xcode-27

    steps:
      # No LFS checkout on purpose: CI builds the Rust engine from source and
      # links that (host mode), so the committed ~87 MB xcframework isn't needed.
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          rustc --version
          cargo --version

      # Cache rust/target + the Cargo registry, keyed on rust/Cargo.lock.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # The xcframework isn't committed (it ships as a Release asset), so a fresh
      # checkout has neither a local xcframework nor a remote-resolvable binary;
      # building the host lib below makes Package.swift link it (host mode). This
      # rm is a defensive guard in case a local xcframework ever leaks in.
      - name: Force host mode
        run: rm -rf artifacts/CTantivy.xcframework

      - name: Build Rust FFI (host)
        run: scripts/build-host.sh

      - name: Run tests
        run: swift test
